# Laptop/VM scale demonstration: docker compose -f compose.yaml -f compose.scale.yaml up --build -d --wait
services:
  api:
    ports: !reset []
    environment:
      AUTO_MIGRATE: "false"
      WEB_CONCURRENCY: "1"
      API_CONCURRENCY_LIMIT: "100"
      DB_POOL_SIZE: "5"
      DB_MAX_OVERFLOW: "5"
      DB_POOL_TIMEOUT_SECONDS: "3"
      DB_COMPATIBLE_REVISIONS: "${DB_COMPATIBLE_REVISIONS:-}"
      # Only the trusted gateway publishes a port in this demonstration network.
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1"
          memory: 512M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=4).close()"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: .
      target: runtime
    command: ["python", "-m", "scripts.migrate"]
    environment:
      DATABASE_URL: postgresql://notes:notes@db:5432/notes
      DB_POOL_SIZE: "1"
      DB_MAX_OVERFLOW: "0"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  gateway:
    image: nginx:stable-alpine
    user: "101:101"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101,mode=1770
    depends_on:
      api:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
