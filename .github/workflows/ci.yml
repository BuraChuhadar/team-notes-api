name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check dependencies, lint, types, and isolated PostgreSQL tests
        run: docker compose --profile test run --build --rm tests

      - name: Start the application stack
        run: docker compose up --build --detach --wait --wait-timeout 120

      - name: Verify the API and unprivileged container user
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/health
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:8000/openapi.json
          test "$(docker compose exec -T api id -u)" -ne 0

      - name: Run the complete HTTP collaboration demo
        run: docker compose exec -T api python scripts/demo.py

      - name: Show service logs on failure
        if: failure()
        run: docker compose --profile test logs --no-color

      - name: Clean up the CI stack
        if: always()
        run: docker compose --profile test down --volumes
