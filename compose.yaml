services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: notes
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: notes
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes -d notes"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgresql://notes:notes@db:5432/notes
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  test-db:
    image: postgres:18-alpine
    profiles:
      - test
    environment:
      POSTGRES_DB: notes_test
      POSTGRES_USER: notes
      POSTGRES_PASSWORD: notes
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notes -d notes_test"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

  tests:
    profiles:
      - test
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_URL: postgresql://notes:notes@test-db:5432/notes_test
    depends_on:
      test-db:
        condition: service_healthy

volumes:
  postgres_data:
