worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream notes_api {
        zone notes_api 64k;
        server api:8000 resolve max_fails=2 fail_timeout=5s;
        keepalive 32;
    }

    server {
        listen 8080;
        # Allow maximum-length Unicode notes even when JSON uses surrogate escapes.
        client_max_body_size 2m;
        keepalive_timeout 5s;

        # Scrape metrics directly on each private API instance with its token.
        location = /metrics {
            return 404;
        }

        location / {
            proxy_pass http://notes_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}
