# Optional example: configure your ingress controller, hostname, and TLS secret.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: notes-api
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
spec:
  ingressClassName: nginx
  tls:
    - hosts: [notes.example.com]
      secretName: notes-api-tls
  rules:
    - host: notes.example.com
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend: &api_backend
              service:
                name: notes-api
                port:
                  name: http
          - path: /notes
            pathType: Prefix
            backend: *api_backend
          - path: /teams
            pathType: Prefix
            backend: *api_backend
          - path: /health
            pathType: Exact
            backend: *api_backend
          - path: /ready
            pathType: Exact
            backend: *api_backend
          - path: /docs
            pathType: Prefix
            backend: *api_backend
          - path: /redoc
            pathType: Exact
            backend: *api_backend
          - path: /openapi.json
            pathType: Exact
            backend: *api_backend
