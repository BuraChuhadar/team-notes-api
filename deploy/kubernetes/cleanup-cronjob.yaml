apiVersion: batch/v1
kind: CronJob
metadata:
  name: notes-api-session-cleanup
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 120
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: cleanup
              image: notes-api:local
              imagePullPolicy: IfNotPresent
              command: [python, -m, scripts.cleanup_sessions, --batch-size, "1000", --max-batches, "10"]
              envFrom:
                - configMapRef:
                    name: notes-api-config
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: notes-api-credentials
                      key: DATABASE_URL
                - name: DB_POOL_SIZE
                  value: "1"
                - name: DB_MAX_OVERFLOW
                  value: "0"
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
