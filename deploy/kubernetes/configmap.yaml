apiVersion: v1
kind: ConfigMap
metadata:
  name: notes-api-config
data:
  AUTO_MIGRATE: "false"
  WEB_CONCURRENCY: "1"
  PASSWORD_HASH_CONCURRENCY: "2"
  API_CONCURRENCY_LIMIT: "100"
  DB_POOL_SIZE: "5"
  DB_MAX_OVERFLOW: "5"
  DB_POOL_TIMEOUT_SECONDS: "3"
  DB_CONNECT_TIMEOUT_SECONDS: "5"
  DB_STATEMENT_TIMEOUT_MS: "10000"
  DB_LOCK_TIMEOUT_MS: "3000"
  DB_IDLE_TRANSACTION_TIMEOUT_MS: "15000"
  DB_MIGRATION_TIMEOUT_MS: "120000"
  DB_TRIGRAM_SCHEMA: notes_extensions
  DB_COMPATIBLE_REVISIONS: ""
  LOGIN_RATE_LIMIT_ATTEMPTS: "10"
  LOGIN_IP_RATE_LIMIT_ATTEMPTS: "50"
  LOGIN_RATE_LIMIT_WINDOW_SECONDS: "60"
